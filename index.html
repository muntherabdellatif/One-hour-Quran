<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مؤقت الحفظ والمراجعة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --primary: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --stage-far: #38bdf8;
      --stage-near: #818cf8;
      --stage-memorize: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 2rem;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .stages-bar {
      display: flex;
      width: 100%;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.6);
      padding: 0.5rem;
      border-radius: 14px;
    }

    .stage-pill {
      flex: 1;
      text-align: center;
      padding: 0.5rem 0.2rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      transition: all 0.3s ease;
      opacity: 0.5;
    }

    .stage-pill.active {
      opacity: 1;
      color: #fff;
    }

    .stage-pill[data-stage="0"].active { background: var(--stage-far); color: #0f172a; }
    .stage-pill[data-stage="1"].active { background: var(--stage-near); color: #0f172a; }
    .stage-pill[data-stage="2"].active { background: var(--stage-memorize); color: #0f172a; }

    .timer-circle-wrapper {
      position: relative;
      width: 240px;
      height: 240px;
    }

    .timer-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .circle-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 8;
    }

    .circle-progress {
      fill: none;
      stroke: var(--stage-far);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 691;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.5s ease, stroke 0.5s ease;
    }

    .timer-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .time-display {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .stage-label {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: -0.25rem;
    }

    .controls {
      display: flex;
      gap: 0.75rem;
      width: 100%;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      transition: all 0.2s ease;
    }

    .btn-main {
      flex: 2;
      background: var(--primary);
      color: #0f172a;
    }

    .btn-main:hover { opacity: 0.9; }

    .btn-sec {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text);
    }

    .btn-sec:hover { background: rgba(255, 255, 255, 0.18); }

    .total-time {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="stages-bar">
    <div class="stage-pill active" data-stage="0">مراجعة بعيدة (20د)</div>
    <div class="stage-pill" data-stage="1">مراجعة قريبة (20د)</div>
    <div class="stage-pill" data-stage="2">حفظ (20د)</div>
  </div>

  <div class="timer-circle-wrapper">
    <svg class="timer-svg" viewBox="0 0 240 240">
      <circle class="circle-bg" cx="120" cy="120" r="110"/>
      <circle class="circle-progress" id="progress" cx="120" cy="120" r="110"/>
    </svg>
    <div class="timer-center">
      <div class="time-display" id="time-display">20:00</div>
      <div class="stage-label" id="stage-label">مراجعة بعيدة</div>
    </div>
  </div>

  <div class="total-time" id="total-display">إجمالي الوقت المتبقي: 60:00</div>

  <div class="controls">
    <button class="btn-main" id="start-btn">بدء</button>
    <button class="btn-sec" id="skip-btn">تخطي</button>
    <button class="btn-sec" id="reset-btn">إعادة</button>
  </div>
</div>

<script>
  // تقسيم الساعة لثلاث مراحل متساوية (20 دقيقة لكل مرحلة)
  const stages = [
    { name: 'مراجعة بعيدة', duration: 20 * 60, color: '#38bdf8' },
    { name: 'مراجعة قريبة', duration: 20 * 60, color: '#818cf8' },
    { name: 'حفظ', duration: 20 * 60, color: '#34d399' }
  ];

  let currentStage = 0;
  let remainingTime = stages[0].duration;
  let timerId = null;
  const circumference = 2 * Math.PI * 110;

  const progress = document.getElementById('progress');
  const timeDisplay = document.getElementById('time-display');
  const stageLabel = document.getElementById('stage-label');
  const totalDisplay = document.getElementById('total-display');
  const startBtn = document.getElementById('start-btn');
  const skipBtn = document.getElementById('skip-btn');
  const resetBtn = document.getElementById('reset-btn');
  const pills = document.querySelectorAll('.stage-pill');

  function format(seconds) {
    const m = Math.floor(seconds / 60).toString().padStart(2, '0');
    const s = (seconds % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function playTone(freq, type = 'sine') {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.6);
    } catch(e) {}
  }

  function updateUI() {
    timeDisplay.textContent = format(remainingTime);
    stageLabel.textContent = stages[currentStage].name;
    progress.style.stroke = stages[currentStage].color;

    const offset = circumference - (remainingTime / stages[currentStage].duration) * circumference;
    progress.style.strokeDashoffset = offset;

    pills.forEach((p, idx) => {
      p.classList.toggle('active', idx === currentStage);
    });

    let totalRemaining = remainingTime;
    for (let i = currentStage + 1; i < stages.length; i++) {
      totalRemaining += stages[i].duration;
    }
    totalDisplay.textContent = `إجمالي الوقت المتبقي: ${format(totalRemaining)}`;
  }

  function nextStage() {
    playTone(587.33);
    if (currentStage < stages.length - 1) {
      currentStage++;
      remainingTime = stages[currentStage].duration;
      updateUI();
    } else {
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = 'بدء';
      playTone(880);
      alert('أحسنت! أتممت جلسة الساعة كاملة بنجاح.');
      reset();
    }
  }

  function tick() {
    if (remainingTime > 0) {
      remainingTime--;
      updateUI();
    } else {
      nextStage();
    }
  }

  function toggleStart() {
    if (timerId) {
      clearInterval(timerId);
      timerId = null;
      startBtn.textContent = 'استئناف';
    } else {
      timerId = setInterval(tick, 1000);
      startBtn.textContent = 'إيقاف مؤقت';
    }
  }

  function reset() {
    clearInterval(timerId);
    timerId = null;
    currentStage = 0;
    remainingTime = stages[0].duration;
    startBtn.textContent = 'بدء';
    updateUI();
  }

  startBtn.addEventListener('click', toggleStart);
  skipBtn.addEventListener('click', nextStage);
  resetBtn.addEventListener('click', reset);

  progress.style.strokeDasharray = circumference;
  updateUI();
</script>
</body>
</html>
